name: Release validation
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify committed manifest version matches release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import json, os; version=json.load(open('custom_components/weatherflow_forecast_alt/manifest.json'))['version']; assert version == os.environ['RELEASE_TAG'].removeprefix('v'), (version, os.environ['RELEASE_TAG'])"
