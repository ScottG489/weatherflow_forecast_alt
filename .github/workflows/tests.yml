name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.13"
            ha: "2025.3.4"
          - python: "3.14"
            ha: "2026.11.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "homeassistant==${{ matrix.ha }}" pytest pytest-asyncio ruff
      - name: Install pinned library
        run: python -c "import json, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *json.load(open('custom_components/weatherflow_forecast_alt/manifest.json'))['requirements']])"
      - run: python -m pytest -q
      - run: ruff check --no-cache .
